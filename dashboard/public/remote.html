<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<title>Symphonee - Connexion</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #0b0f14; color: #e6edf3; font: 16px/1.4 system-ui, sans-serif; padding: 16px; box-sizing: border-box; }
  main { width: 100%; max-width: 360px; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { color: #8b949e; margin: 0 0 20px; }
  input { width: 100%; box-sizing: border-box; font: 28px/1 ui-monospace, monospace; letter-spacing: 8px; text-align: center;
          padding: 14px; border-radius: 10px; border: 1px solid #30363d; background: #161b22; color: #e6edf3; }
  button { width: 100%; margin-top: 14px; padding: 14px; font-size: 17px; border: 0; border-radius: 10px;
           background: #2f81f7; color: #fff; }
  button:disabled { opacity: .5; }
  #msg { min-height: 1.4em; margin-top: 14px; color: #f85149; text-align: center; }
</style>
</head>
<body>
<main>
  <h1>Connexion a Symphonee</h1>
  <p>Saisissez le code a 6 chiffres affiche sur votre PC. Il expire apres 5 minutes.</p>
  <form id="f" autocomplete="off">
    <input id="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="000000" aria-label="Code d'appairage" required>
    <button id="go" type="submit">Connecter</button>
  </form>
  <div id="msg" role="alert"></div>
</main>
<script>
(function () {
  var f = document.getElementById('f'), input = document.getElementById('code'),
      btn = document.getElementById('go'), msg = document.getElementById('msg');
  var reasons = {
    no_pending_code: 'Aucun code actif. Demandez un nouveau code sur le PC.',
    expired: 'Ce code a expire. Demandez un nouveau code sur le PC.',
    locked: 'Trop d essais. Demandez un nouveau code sur le PC.',
    bad_code: 'Code incorrect.',
    bad_json: 'Requete invalide.'
  };
  f.addEventListener('submit', function (e) {
    e.preventDefault();
    var code = input.value.replace(/\s/g, '');
    if (!/^[0-9]{6}$/.test(code)) { msg.textContent = 'Le code contient 6 chiffres.'; return; }
    btn.disabled = true; msg.textContent = '';
    fetch('/api/remote/pair', {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ code: code })
    }).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        if (res.ok && res.j.ok) { window.location.replace('/'); return; }
        var t = reasons[res.j.reason] || 'Connexion refusee.';
        if (res.j.attemptsLeft !== undefined) t += ' Essais restants : ' + res.j.attemptsLeft + '.';
        msg.textContent = t; btn.disabled = false; input.select();
      })
      .catch(function () { msg.textContent = 'Connexion impossible. Verifiez le reseau.'; btn.disabled = false; });
  });
})();
</script>
</body>
</html>

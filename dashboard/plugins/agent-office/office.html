<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bureau des agents</title>
<style>
  :root {
    --bg:#11121a; --panel:#191b26; --card:#1f2230; --card2:#252938; --line:#2f3346; --text:#eef0f8; --dim:#a3a8bf; --faint:#6f748c;
    --green:#5fd39a; --blue:#7aa8ff; --amber:#ffc95c; --red:#ff7a8f; --violet:#b69cff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text);
    font: 13px/1.45 "Segoe UI", system-ui, sans-serif; }
  body { padding: 0 0 24px; }
  .top { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 12px 20px; background: rgba(17,18,26,.92); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }
  .top h1 { font-size: 16px; margin: 0; font-weight: 700; letter-spacing: .2px; }
  #mode { font-size: 10px; font-weight: 700; letter-spacing: .08em; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--dim); }
  #mode.live { color: var(--green); border-color: #2f6b4e; }
  #mode.live::before { content: ''; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--green); margin-right: 6px; vertical-align: 1px; animation: blink 1.6s infinite; }
  #mode.demo { color: var(--amber); border-color: #6b5527; }
  #mode.stale, #mode.error { color: var(--amber); border-color: #8e7029; }
  #counts { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
  .count { font: inherit; font-size: 11px; padding: 3px 10px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); color: var(--dim); cursor: pointer; }
  .count:disabled { cursor: default; opacity: .75; }
  .count:not(:disabled):hover { border-color: #454a63; }
  .count b { color: var(--text); margin-right: 3px; }
  #clock { font-variant-numeric: tabular-nums; color: var(--dim); font-size: 12px; }
  main { padding: 16px 20px; display: flex; flex-direction: column; gap: 22px; max-width: 1280px; margin: 0 auto; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .09em; color: var(--dim); margin: 0 0 10px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  h2 .n { background: var(--card2); color: var(--text); border-radius: 999px; padding: 0 7px; font-size: 10px; letter-spacing: 0; }
  .empty { color: var(--faint); padding: 18px; border: 1px dashed var(--line); border-radius: 12px; text-align: center; }

  /* Diagnosis strip */
  .verdict { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); }
  .verdict .ic { width: 34px; height: 34px; flex: none; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; color: #11121a; background: var(--faint); }
  .verdict.ok .ic { background: var(--green); } .verdict.attention .ic { background: var(--amber); } .verdict.bloque .ic { background: var(--red); }
  .verdict.bloque { border-color: #7a3442; } .verdict.attention { border-color: #6b5527; }
  .verdict .t { font-weight: 700; font-size: 14px; } .verdict .s { color: var(--dim); font-size: 11px; }
  .alerts { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; margin-top: 10px; }
  .alert { background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--amber); border-radius: 10px; padding: 10px 12px; }
  .alert.bloque { border-left-color: var(--red); }
  .alert .who { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); }
  .alert .what { font-weight: 700; margin: 2px 0 4px; }
  .alert .why { color: var(--dim); font-size: 12px; }
  .alert .todo { font-size: 12px; margin-top: 4px; } .alert .todo b { color: var(--text); }
  .more { color: var(--faint); font-size: 11px; margin-top: 8px; }

  /* Animated office (canvas) */
  .stage { position: relative; display: flex; justify-content: center; align-items: center; overflow: hidden; border-radius: 14px;
    border: 1px solid var(--line); background: radial-gradient(ellipse at center, #302d48, #171621 72%); }
  #c { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
  #c:focus-visible { outline: 2px solid var(--violet); outline-offset: -2px; }
  .sechead { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .sechead h2 { margin: 0; }
  .tools { margin-left: auto; display: flex; gap: 6px; }
  .tools button { font: inherit; font-size: 11px; color: var(--dim); background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 3px 11px; cursor: pointer; }
  .tools button:hover { color: var(--text); border-color: #454a63; }
  .tools button:focus-visible, .attn button:focus-visible, .count:focus-visible { outline: 2px solid var(--violet); outline-offset: 2px; }
  .attn { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; padding: 9px 14px; border-radius: 12px; background: #3a2f12; border: 1px solid #7a6326; color: #ffe29a; }
  .attn[hidden] { display: none; }
  .attn .pip { width: 9px; height: 9px; border-radius: 50%; background: var(--amber); flex: none; animation: blink 1.2s infinite; }
  .attn b { color: #fff3cf; }
  .attn button { margin-left: auto; font: inherit; font-size: 12px; font-weight: 700; color: #3a2f12; background: var(--amber); border: 0; border-radius: 999px; padding: 4px 14px; cursor: pointer; }
  .tip { position: absolute; z-index: 3; pointer-events: none; max-width: 240px; padding: 6px 10px; border-radius: 8px; font-size: 12px; line-height: 1.35;
    background: rgba(17,18,26,.94); border: 1px solid var(--line); color: var(--text); box-shadow: 0 6px 18px rgba(0,0,0,.4); }
  .tip[hidden], .calm[hidden] { display: none; }
  .calm { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); pointer-events: none; padding: 5px 14px; border-radius: 999px; font-size: 12px; color: var(--dim); background: rgba(17,18,26,.8); border: 1px solid var(--line); }
  #sheet { margin-top: 10px; min-height: 44px; padding: 10px 14px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); color: var(--dim); font-size: 12px; }
  #sheet .sh { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  #sheet b { color: var(--text); font-size: 14px; }
  #sheet .st { margin-top: 4px; overflow-wrap: anywhere; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 8px; color: var(--faint); font-size: 11px; }
  .legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }

  /* Desks */
  .desks { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
  .desk { position: relative; text-align: left; font: inherit; color: inherit; cursor: pointer; background: linear-gradient(180deg, var(--card2), var(--card));
    border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; gap: 12px; align-items: flex-start; transition: border-color .15s, transform .15s; }
  .desk:hover { border-color: #454a63; transform: translateY(-1px); }
  .desk:focus-visible { outline: 2px solid var(--violet); outline-offset: 2px; }
  .desk.sel { border-color: var(--violet); }
  .desk.waiting { border-color: #7a6326; box-shadow: 0 0 0 1px #7a6326 inset; }
  .desk.failed { border-color: #6e3040; }
  .av { position: relative; width: 46px; height: 46px; flex: none; }
  .av .face { position: absolute; inset: 4px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 15px; color: #11121a; }
  .av .ring { position: absolute; inset: 0; border-radius: 50%; border: 2px solid transparent; }
  .working .av .ring { border-color: var(--green) transparent var(--green) transparent; animation: spin 2.4s linear infinite; }
  .thinking .av .ring { border-color: var(--blue) transparent transparent transparent; animation: spin 1.4s linear infinite; }
  .waiting .av .ring { border-color: var(--amber); animation: pulse 1.2s ease-in-out infinite; }
  .failed .av .ring { border-color: var(--red); }
  .done .av .ring { border-color: var(--green); }
  .idle .av .face, .stopped .av .face, .unknown .av .face { filter: saturate(.35) brightness(.8); }
  .av .badge { position: absolute; right: -2px; bottom: -2px; width: 18px; height: 18px; border-radius: 50%; background: var(--bg); border: 2px solid var(--bg);
    display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 800; }
  .body { min-width: 0; flex: 1; }
  .nm { display: flex; align-items: center; gap: 6px; }
  .nm b { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chip { margin-left: auto; font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap; background: #33364a; color: #d6d8e6; }
  .chip.working { background: #1d4634; color: #9ff0c4; } .chip.thinking { background: #24365e; color: #b3cbff; }
  .chip.waiting { background: #5c4a14; color: #ffd874; } .chip.done { background: #1e4436; color: #a4e8c2; } .chip.failed { background: #5a2330; color: #ffa9b9; }
  .sub { color: var(--faint); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .task { color: var(--dim); font-size: 12px; margin-top: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .desk.sel .task { -webkit-line-clamp: unset; }
  .time { color: var(--faint); font-size: 11px; margin-top: 6px; }
  .dots i { display: inline-block; width: 4px; height: 4px; margin-right: 2px; border-radius: 50%; background: currentColor; animation: dot 1.2s infinite; }
  .dots i:nth-child(2) { animation-delay: .2s; } .dots i:nth-child(3) { animation-delay: .4s; }

  /* Loops */
  .loops { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
  .loop { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .loop .hd { display: flex; align-items: center; gap: 8px; }
  .loop .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--faint); flex: none; }
  .loop.working .dot { background: var(--green); box-shadow: 0 0 0 4px rgba(95,211,154,.18); animation: blink 1.6s infinite; }
  .loop.resting .dot { background: var(--amber); } .loop.error .dot { background: var(--red); }
  .loop .hd b { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .loop .st { font-size: 11px; font-weight: 700; color: var(--dim); }
  .loop .flag { font-size: 9px; font-weight: 800; text-transform: uppercase; padding: 1px 6px; border-radius: 999px; background: var(--amber); color: #11121a; }
  .loop .flag.bloque { background: var(--red); }
  .loop .dt { color: var(--dim); font-size: 12px; margin: 6px 0 8px; overflow-wrap: anywhere; }
  .day { position: relative; height: 8px; border-radius: 4px; background: #2a2d3d; overflow: hidden; }
  .day .win { position: absolute; top: 0; bottom: 0; background: #3f6b8f; }
  .loop.working .day .win { background: #3c8a64; }
  .day .now { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--text); }
  .hours { display: flex; justify-content: space-between; color: var(--faint); font-size: 9px; margin-top: 3px; }
  .win-txt { color: var(--faint); font-size: 11px; }

  /* Team */
  .team { display: flex; flex-wrap: wrap; gap: 8px; }
  .member { display: flex; align-items: center; gap: 8px; padding: 6px 12px 6px 6px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); }
  .member .mini { width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 800; color: #11121a; }
  .member .ms { color: var(--faint); font-size: 11px; }

  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 50% { box-shadow: 0 0 0 5px rgba(255,201,92,.25); } }
  @keyframes blink { 50% { opacity: .35; } }
  @keyframes dot { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  @media (max-width: 720px) { .top { padding: 10px 14px; } main { padding: 12px 14px; } #counts { margin-left: 0; width: 100%; } }
</style>
</head>
<body>
<header class="top">
  <h1>Bureau des agents</h1>
  <span id="mode" role="status" aria-live="polite">Chargement...</span>
  <span id="clock"></span>
  <div id="counts" aria-live="polite"></div>
</header>
<main>
  <section aria-labelledby="hOffice">
    <div class="sechead"><h2 id="hOffice">Le bureau</h2>
      <span class="tools"><button type="button" id="calmBtn" aria-pressed="true" title="Activer ou couper les animations">Animations : oui</button></span></div>
    <div id="attn" class="attn" role="status" hidden></div>
    <div id="stage" class="stage">
      <canvas id="c" width="480" height="270" tabindex="0" role="application" aria-label="Bureau des agents. Fleches gauche et droite pour passer d'un agent a l'autre, Echap pour deselectionner. Les details sont aussi dans les cartes plus bas."></canvas>
      <div id="tip" class="tip" hidden aria-hidden="true"></div>
      <div id="calm" class="calm" hidden>Le bureau est calme : personne au travail.</div>
    </div>
    <div id="sheet" aria-live="polite">Clique sur un personnage pour voir sa fiche.</div>
    <div class="legend" aria-hidden="true"><span><i style="background:#5fd39a"></i>travaille</span><span><i style="background:#7aa8ff"></i>reflechit</span><span><i style="background:#ffc95c"></i>attend ta reponse</span><span><i style="background:#ff7a8f"></i>echec</span><span><i style="background:#6f748c"></i>au repos</span></div>
  </section>
  <section aria-labelledby="hAlerts"><h2 id="hAlerts">Ce qui coince</h2><div id="alerts"><div class="empty">Diagnostic en cours...</div></div></section>
  <section aria-labelledby="hDesks"><h2 id="hDesks">Au travail <span class="n" id="nDesks">0</span></h2><div id="list" class="desks"></div></section>
  <section aria-labelledby="hLoops"><h2 id="hLoops">Boucles automatiques</h2><div id="loops" class="loops"></div></section>
  <section aria-labelledby="hTeam"><h2 id="hTeam">L equipe disponible</h2><div id="team" class="team"></div></section>
</main>
<script>
(function () {
  'use strict';

  // ---------------------------------------------------------------------
  // Constants
  // ---------------------------------------------------------------------
  var DONE_LINGER_MS = 5 * 60 * 1000;
  var FAILED_LINGER_MS = 10 * 60 * 1000;
  var THINK_AFTER_MS = 20 * 1000;   // running but silent this long -> thinking
  var IDLE_AFTER_MS = 90 * 1000;    // terminal CLI silent this long -> idle

  // Animated office geometry (logical pixels, drawn on a 480x270 canvas).
  var W = 480, H = 270, WALL = 66;
  var DOOR = { x: 27, y: 78 };
  var DESK_COLS = 4, DESK_ROWS = 2, DESK_W = 48;
  var SPEED = 46;                   // px per second
  var FRAME_MS = 33;                // ~30 images per second is plenty for pixel art
  var SKINS = ['#f1c9a5', '#d9a379', '#b97f56', '#8b5a3c'];

  var CLI_PAL = {
    claude:      { body: '#d97a4a', hair: '#5a3524', name: 'Claude' },
    codex:       { body: '#2fa58a', hair: '#1d2b33', name: 'Codex' },
    gemini:      { body: '#4f7fe0', hair: '#2b2350', name: 'Gemini' },
    'gemini-api':{ body: '#4f7fe0', hair: '#2b2350', name: 'Gemini' },
    qwen:        { body: '#8e63d6', hair: '#33204f', name: 'Qwen Code' },
    'ollama-mind': { body: '#a47be0', hair: '#33204f', name: 'Qwen Mind local' },
    'symphonee-qwen-mind': { body: '#a47be0', hair: '#33204f', name: 'Qwen Mind local' },
    grok:        { body: '#8d94a3', hair: '#22252b', name: 'Grok' },
    copilot:     { body: '#d268a8', hair: '#4a2238', name: 'Copilot' },
    jules:       { body: '#d9b84a', hair: '#4a3a16', name: 'Jules' },
    antigravity: { body: '#56b8d6', hair: '#18323d', name: 'Antigravity' }
  };
  var DEFAULT_PAL = { body: '#9aa0b5', hair: '#33354a', name: 'Agent' };
  var STATE_LABEL = { working: 'travaille', thinking: 'reflechit', waiting: 'attend', idle: 'au repos', done: 'termine', failed: 'echec', stopped: 'arrete', unknown: 'etat inconnu' };

  function palFor(cli) { return CLI_PAL[String(cli || '').toLowerCase()] || { body: DEFAULT_PAL.body, hair: DEFAULT_PAL.hair, name: String(cli || 'Agent').slice(0, 50) }; }
  function hash(s) { var h = 2166136261; s = String(s); for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

  // ---------------------------------------------------------------------
  // Data layer: turns Symphonee API responses into a flat list of agents.
  // Kept free of DOM/canvas so it can be exercised on its own.
  // ---------------------------------------------------------------------
  var WAIT_RE = /(do you want to|would you like to|\(y\/n\)|\[y\/n\]|allow this|approve|waiting for (your )?(input|approval)|press enter to)/i;

  function taskTitle(t) {
    // Prompts can contain secrets and private context. Show structured task fields only.
    var parts = [t.taskClass && ('Type: ' + String(t.taskClass).slice(0, 40)), t.selectedRole && ('Role: ' + String(t.selectedRole).slice(0, 40)),
      t.from && ('Origine: ' + String(t.from).slice(0, 60)), t.space && ('Espace: ' + String(t.space).slice(0, 60)), t.id && ('Tache: ' + String(t.id).slice(0, 16))].filter(Boolean);
    return parts.join(' | ') || 'Tache sans description publique';
  }

  function taskState(t, hb, now) {
    var s = String(t.state || '').toLowerCase();
    if (s === 'completed' || s === 'done' || s === 'success') return 'done';
    if (s === 'failed' || s === 'error' || s === 'timeout' || s === 'timed_out' || s === 'cancelled' || s === 'canceled' || s === 'killed') return 'failed';
    if (s === 'pending' || s === 'queued' || s === 'waiting') return 'waiting';
    if (s !== 'running') return 'unknown';
    if (hb && typeof hb.lastActivity === 'number' && now - hb.lastActivity > THINK_AFTER_MS) return 'thinking';
    return 'working';
  }

  // tasks: /api/orchestrator/tasks, heartbeats: /api/orchestrator/heartbeats,
  // terms: /api/terminals/diag .terminals, aiByTerm: detect-ai .byTerm,
  // termActivity: { termId: { lastChange, tail } }
  function buildAgents(tasks, heartbeats, terms, aiByTerm, termActivity, now, loops, activity, localHealth) {
    var out = [];
    var hbById = {};
    (heartbeats || []).forEach(function (h) { if (h && h.taskId) hbById[h.taskId] = h; });
    var absorbed = {};
    var loopList = loops ? (loops.loops || []).concat(loops.services || []) : [];
    loopList.forEach(function (l) {
      if (!l || !l.id) return;
      var task = l.taskId && (tasks || []).find(function (t) { return t && t.id === l.taskId; });
      if (task && l.status === 'working') absorbed[task.id] = true;
      var actualCli = task && (task.cli || task.selectedProvider);
      var loopState = l.status === 'working' ? 'working' : l.status === 'resting' ? 'idle' : l.status === 'error' ? 'failed' : 'stopped';
      if (l.status === 'working' && l.taskId && (!task || !/^(running|pending)$/i.test(String(task.state || '')))) loopState = 'unknown';
      else if (l.status === 'working' && task && String(task.state || '').toLowerCase() === 'pending') loopState = 'waiting';
      out.push({ id: 'loop:' + l.id, kind: 'loop', cli: String(actualCli || (l.status === 'working' ? l.cli : '') || 'script'),
        name: String(l.label || l.id), model: task && task.model || '', title: String(l.detail || l.statusLabel || ''),
        state: loopState, since: now, endedAt: null, statusLabel: loopState === 'unknown' || loopState === 'waiting' ? '' : l.statusLabel || '' });
    });
    if (activity && Number.isFinite(activity.activeCount) && activity.activeCount > 0) {
      out.push({ id: 'brain:direct-local-ask', kind: 'brain', cli: 'ollama-mind', model: '', name: 'Cerveau local',
        title: activity.activeCount + ' demande(s) directe(s) en cours', state: 'working', since: activity.startedAt || now, endedAt: null, locality: 'local' });
    }

    (terms || []).forEach(function (t) {
      if (!t || !t.id) return;
      var cli = aiByTerm && aiByTerm[t.id];
      if (!cli) return; // a plain shell is not an agent
      if (typeof cli === 'object') cli = cli.cli || cli.name || 'agent';
      var act = (termActivity && termActivity[t.id]) || {};
      var silent = act.lastChange ? now - act.lastChange : 0;
      var state = act.lastChange && !act.failed ? 'working' : 'unknown';
      if (state !== 'unknown' && act.tail && WAIT_RE.test(act.tail)) state = 'waiting';
      else if (state !== 'unknown' && silent > IDLE_AFTER_MS) state = 'idle';
      else if (state !== 'unknown' && silent > THINK_AFTER_MS) state = 'thinking';
      out.push({
        id: 'term:' + t.id, kind: 'terminal', cli: String(cli), model: '',
        title: t.label ? 'Terminal ' + t.label : (t.id === 'main' ? 'Terminal principal' : 'Terminal ' + t.id),
        state: state, since: act.firstSeen || now, endedAt: null
      });
    });

    (tasks || []).forEach(function (t) {
      if (!t || !t.id || absorbed[t.id]) return;
      var st = taskState(t, hbById[t.id], now);
      var ended = t.completedAt || null;
      if (st === 'done' && (!ended || now - ended > DONE_LINGER_MS)) return;
      if (st === 'failed' && (!ended || now - ended > FAILED_LINGER_MS)) return;
      out.push({
        id: 'task:' + t.id, kind: 'task', cli: String(t.cli || t.selectedProvider || 'agent'),
        model: String(t.model || ''), title: taskTitle(t), state: st, locality: t.execution && t.execution.locality || t.locality || '',
        since: t.startedAt || t.createdAt || now, endedAt: ended
      });
    });
    // The installed local Mind provider has no permanent CLI terminal. Give it
    // a desk when idle, without claiming a task is running or duplicating work.
    var qwen = localHealth && localHealth.providers && localHealth.providers['symphonee-qwen-mind'];
    var hasQwen = out.some(function (a) { return a.cli === 'symphonee-qwen-mind' || a.cli === 'ollama-mind'; });

    var sub = [a.kind === 'loop' ? pal.name : '', a.model, a.kind === 'terminal' ? 'terminal' : '', a.locality].filter(Boolean).join(' | ');
    return '<div class="sh"><b>' + esc(who) + '</b><span class="chip ' + esc(a.state) + '">' + esc(a.statusLabel || STATE_LABEL[a.state] || 'inconnu') + '</span>'
      + (sub ? '<span>' + esc(sub) + '</span>' : '') + '<span>' + esc(when) + '</span></div><div class="st">' + esc(a.title) + '</div>';
  }

  // "22:00-04:00" -> [[22,24],[0,4]] in hours, for the day bar.
  function windowSpans(text) {
    var m = String(text || '').match(/(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})/);
    if (!m) return null;
    var a = +m[1] + m[2] / 60, b = +m[3] + m[4] / 60;
    return a < b ? [[a, b]] : [[a, 24], [0, b]];
  }

  function loopsHtml(loops, health, now) {
    if (!loops) return '<div class="empty">Etat des boucles indisponible.</div>';
    var probs = (health && health.problems) || [];
    var d = new Date(now), hour = d.getHours() + d.getMinutes() / 60;
    var all = (loops.loops || []).concat(loops.services || []);
    if (!all.length) return '<div class="empty">Aucune boucle configuree.</div>';
    return all.map(function (l) {
      var mine = probs.filter(function (p) { return p.target && (p.target.pilot ? p.target.pilot === l.pilot : p.target.loop === l.id); });
      var worst = mine.some(function (p) { return p.severity === 'bloque'; }) ? 'bloque' : mine.some(function (p) { return p.severity === 'attention'; }) ? 'attention' : '';
      var spans = windowSpans(l.window);
      var bar = spans ? '<div class="day" title="Plage de travail ' + esc(l.window) + '">' + spans.map(function (s) {
        return '<span class="win" style="left:' + (s[0] / 24 * 100).toFixed(2) + '%;width:' + ((s[1] - s[0]) / 24 * 100).toFixed(2) + '%"></span>';
      }).join('') + '<span class="now" style="left:' + (hour / 24 * 100).toFixed(2) + '%"></span></div><div class="hours"><span>0 h</span><span>6 h</span><span>12 h</span><span>18 h</span><span>24 h</span></div>'
        : '<div class="win-txt">' + esc(l.window || '') + '</div>';
      return '<article class="loop ' + esc(l.status) + '"><div class="hd"><span class="dot"></span><b>' + esc(l.label) + '</b>'
        + (worst ? '<span class="flag ' + worst + '">' + (worst === 'bloque' ? 'bloque' : 'a surveiller') + '</span>' : '')
        + '<span class="st">' + esc(l.statusLabel) + '</span></div>'
        + '<div class="dt">' + esc(l.detail) + '</div>' + bar + '</article>';
    }).join('');
  }

  function alertsHtml(health) {
    if (!health) return '<div class="empty">Diagnostic indisponible pour le moment.</div>';
    var v = health.verdict || { level: 'ok', text: '' };
    var icon = { ok: '&#10003;', attention: '!', bloque: '&#10005;' }[v.level] || '?';
    var real = (health.problems || []).filter(function (p) { return p.severity !== 'info'; });
    var shown = real.slice(0, 4);
    return '<div class="verdict ' + esc(v.level) + '"><span class="ic">' + icon + '</span><div><div class="t">' + esc(v.text) + '</div>'
      + '<div class="s">Explications completes et actions : Mind &gt; Autopilote</div></div></div>'
      + (shown.length ? '<div class="alerts">' + shown.map(function (p) {
        return '<div class="alert ' + esc(p.severity) + '"><div class="who">' + esc(p.loop) + '</div><div class="what">' + esc(p.titre) + '</div>'
          + '<div class="why">' + esc(p.pourquoi) + '</div><div class="todo"><b>Que faire :</b> ' + esc(p.quoiFaire) + '</div></div>';
      }).join('') + '</div>' : '')
      + (real.length > shown.length ? '<div class="more">+ ' + (real.length - shown.length) + ' autre(s) point(s) dans Mind &gt; Autopilote.</div>' : '');
  }

  function teamHtml() {
    var providers = providerRows(auxiliary.providers, auxiliary.brain);
    return providers.map(function (p) {
      var pal = palFor(p.id);
      return '<div class="member"><span class="mini" style="background:' + pal.body + '">' + esc(initial(p.name)) + '</span><span><b>' + esc(p.name) + '</b> '
        + '<span class="ms">' + esc([p.model, p.locality, p.state].filter(Boolean).join(' | ')) + '</span></span></div>';
    }).join('') || '<div class="empty">Aucun agent configure.</div>';
  }

  function render(list) {
    var now = Date.now(), order = { waiting: 0, working: 1, thinking: 2, failed: 3, unknown: 4, idle: 5, stopped: 6, done: 7 };
    var desks = deskAgents(list).sort(function (a, b) { return (order[a.state] - order[b.state]) || (a.since - b.since); });
    var active = list.filter(function (a) { return a.state === 'working' || a.state === 'thinking'; }).length;
    var waiting = list.filter(function (a) { return a.state === 'waiting'; }).length;
    var failed = list.filter(function (a) { return a.state === 'failed'; }).length;
    // The counters are buttons: they jump to the next agent in that state.
    function chip(kind, n, label, style) {
      return '<button type="button" class="count" data-jump="' + kind + '"' + (n ? '' : ' disabled') + (n && style ? ' style="' + style + '"' : '') + '><b>' + n + '</b>' + label + '</button>';
    }
    el('counts').innerHTML = chip('working', active, 'au travail', '')
      + chip('waiting', waiting, 'attend une reponse', 'border-color:#7a6326;color:var(--amber)')
      + chip('failed', failed, 'en echec', 'border-color:#6e3040;color:var(--red)');
    // Strip above the office: the one thing that needs the user.
    var waiters = desks.filter(function (a) { return a.state === 'waiting'; }), attn = el('attn');
    if (waiters.length) {
      var w = waiters[0], wn = w.kind === 'loop' ? w.name : (w.name || palFor(w.cli).name);
      attn.innerHTML = '<span class="pip"></span><span><b>' + esc(wn) + '</b> attend ta reponse' + (shortLabel(w) ? ' (' + esc(shortLabel(w)) + ')' : '')
        + (waiters.length > 1 ? ' et ' + (waiters.length - 1) + ' autre(s)' : '') + '</span><button type="button" data-jump="waiting">Voir</button>';
      attn.hidden = false;
    } else { attn.innerHTML = ''; attn.hidden = true; }
    el('calm').hidden = desks.length > 0;
    if (cv.setAttribute) cv.setAttribute('aria-label', 'Bureau des agents : ' + active + ' au travail, ' + waiting + ' en attente de ta reponse, ' + failed + ' en echec. Fleches gauche et droite pour passer d\'un agent a l\'autre.');
    el('nDesks').textContent = String(desks.length);
    var box = el('list');
    var focused = document.activeElement && box.contains && box.contains(document.activeElement) ? document.activeElement.getAttribute('data-id') : null;
    box.innerHTML = desks.length ? desks.map(function (a) { return deskHtml(a, now); }).join('')
      : '<div class="empty" style="grid-column:1/-1">Personne au travail en ce moment. Les boucles ci-dessous attendent leur plage horaire.</div>';
    if (focused && box.querySelectorAll) {
      var next = Array.prototype.find.call(box.querySelectorAll('[data-id]'), function (e) { return e.getAttribute('data-id') === focused; });
      if (next) next.focus({ preventScroll: true });
    }
    el('loops').innerHTML = loopsHtml(auxiliary.loops, auxiliary.health, now);
    el('alerts').innerHTML = alertsHtml(auxiliary.health);
    el('team').innerHTML = teamHtml();
    var chosen = selectedId && list.filter(function (a) { return a.id === selectedId; })[0];
    el('sheet').innerHTML = sheetHtml(chosen || null, now);
  }
  // Jump to the next agent in a given state (counters and the alert strip).
  function jumpTo(kind) {
    var states = kind === 'working' ? ['working', 'thinking'] : [kind];
    var pool = deskAgents(lastList).filter(function (a) { return states.indexOf(a.state) >= 0; });
    if (!pool.length) return;
    var at = pool.map(function (a) { return a.id; }).indexOf(selectedId);
    selectedId = pool[(at + 1) % pool.length].id;
    render(lastList);
    var st = el('stage');
    if (st.scrollIntoView) st.scrollIntoView({ block: 'nearest', behavior: calm ? 'auto' : 'smooth' });
  }
  function onJump(e) {
    var b = e.target.closest ? e.target.closest('[data-jump]') : null;
    if (b && !b.disabled) jumpTo(b.getAttribute('data-jump'));
  }
  el('counts').addEventListener('click', onJump);
  el('attn').addEventListener('click', onJump);

  function syncCalmButton() {
    var b = el('calmBtn');
    b.textContent = calm ? 'Animations : non' : 'Animations : oui';
    b.setAttribute && b.setAttribute('aria-pressed', calm ? 'false' : 'true');
  }
  el('calmBtn').addEventListener('click', function () {
    calm = !calm;
    try { if (window.localStorage) window.localStorage.setItem('agentOfficeCalm', calm ? '1' : '0'); } catch (e) { /* not remembered */ }
    syncCalmButton();
    if (calm) particles.length = 0;
    startLoop();
  });

  el('list').addEventListener('click', function (e) {
    var row = e.target.closest ? e.target.closest('.desk') : null;
    if (!row) return;
    var id = row.getAttribute('data-id');
    selectedId = selectedId === id ? null : id;
    render(lastList);
  });

  // ---------------------------------------------------------------------
  // Loop
  // ---------------------------------------------------------------------
  function setMode(m, detail) {
    var e = el('mode');
    e.className = m;
    e.textContent = m === 'live' ? 'EN DIRECT' : m === 'demo' ? 'DEMO' + (detail ? ' - ' + detail : '') : (m === 'stale' ? 'ETAT PARTIEL' : 'HORS LIGNE') + (detail ? ' - ' + detail : '');
  }

  var forcedDemo = /[?&]demo=1/.test(location.search) || location.protocol === 'file:';
  var polling = false;
  function poll() {
    if (polling) return;
    polling = true;
    // Live is retried on every tick, so the page recovers by itself when the
    // server comes back. Simulated data is never shown without the DEMO badge.
    var src = forcedDemo ? pollDemo() : pollLive().then(function (list) {
      lastSuccessAt = Date.now(); setMode(auxiliary.stale || auxiliary.loopsStale || liveSourcesPartial ? 'stale' : 'live', auxiliary.stale || auxiliary.loopsStale || liveSourcesPartial ? 'certaines sources indisponibles' : ''); return list;
    }, function (err) {
      if (window.console) console.warn('[agent-office] poll failed:', err && err.message);
      setMode(lastSuccessAt ? 'stale' : 'error', lastSuccessAt ? 'derniere lecture ' + new Date(lastSuccessAt).toLocaleTimeString() : 'serveur injoignable');
      return lastList;
    });
    src.then(function (list) {
      lastList = list; syncActors(deskAgents(list)); render(list);
    }).catch(function (err) {
      if (window.console) console.warn('[agent-office] render failed:', err && err.message);
    }).then(function () { polling = false; });
  }
  if (forcedDemo) setMode('demo', 'donnees simulees');

  function tickClock() {
    var d = new Date();
    el('clock').textContent = ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
  }

  // Canvas size: as wide as the page allows, never taller than ~60% of the
  // window, scale in quarter steps so it fills the space and stays crisp.
  function fit() {
    var st = el('stage'), avail = st.clientWidth || W;
    var maxH = Math.max(240, (window.innerHeight || 600) * 0.62);
    var s = Math.min(avail / W, maxH / H);
    s = Math.max(0.5, Math.floor(s * 4) / 4);
    cv.style.width = (W * s) + 'px'; cv.style.height = (H * s) + 'px';
  }
  window.addEventListener('resize', fit);

  // About 30 images per second while something moves, 10 when the room is
  // quiet, 1 in calm mode, and none at all while the tab is hidden.
  var rafId = 0, lastDraw = 0;
  function frame(t) {
    rafId = 0;
    if (document.hidden) return;                       // restarted by visibilitychange
    var gap = calm ? 1000 : isBusy() ? FRAME_MS : 100;   // idle scenes need far fewer images
    if (t - lastDraw >= gap) {
      var dt = Math.min(0.1, (t - (lastDraw || t)) / 1000);
      lastDraw = t; step(dt); draw(Date.now());
    }
    rafId = requestAnimationFrame(frame);
  }
  function startLoop() { if (!rafId) { lastDraw = 0; rafId = requestAnimationFrame(frame); } }
  if (document.addEventListener) document.addEventListener('visibilitychange', function () { if (!document.hidden) startLoop(); });

  // Exposed for tests only.
  window.__agentOffice = { buildAgents: buildAgents, taskState: taskState, taskTitle: taskTitle, providerRows: providerRows, mergeTasks: mergeTasks, windowSpans: windowSpans, deskAgents: deskAgents,
    shortLabel: shortLabel, sheetHtml: sheetHtml, actorAt: actorAt, isBusy: isBusy, setCalm: function (v) { calm = !!v; if (calm) particles.length = 0; }, scene: { actors: actors, particles: particles, deskOwner: deskOwner, syncActors: syncActors, step: step, DOOR: DOOR, overflow: function () { return overflow; } } };

  syncCalmButton(); fit(); tickClock(); poll(); startLoop(); setInterval(poll, 3000); setInterval(function () { tickClock(); render(lastList); }, 5000);
})();
</script>
</body>
</html>

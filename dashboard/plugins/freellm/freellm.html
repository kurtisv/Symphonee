<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FreeLLM</title>
<style>
  :root { --bg:#11121a; --card:#1f2230; --line:#2f3346; --text:#eef0f8; --dim:#a3a8bf; --ok:#5fd08a; --bad:#e0788a; --acc:#78c8a0; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:14px/1.4 system-ui, sans-serif; }
  .bar { display:flex; flex-wrap:wrap; gap:10px; align-items:center; padding:10px 14px; border-bottom:1px solid var(--line); background:var(--card); }
  .pill { padding:2px 10px; border-radius:999px; border:1px solid var(--line); color:var(--dim); }
  .pill.ok { color:var(--ok); border-color:var(--ok); } .pill.bad { color:var(--bad); border-color:var(--bad); }
  button { background:#2b2f44; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:6px 12px; cursor:pointer; }
  button:hover { border-color:var(--acc); } button:disabled { opacity:.5; cursor:default; }
  .note { color:var(--dim); font-size:12px; }
  .empty { padding:24px; color:var(--dim); }
</style></head>
<body>
<div class="bar">
  <strong>FreeLLM</strong>
  <span id="run" class="pill">...</span><span id="cfg" class="pill">...</span><span id="mod" class="note"></span>
  <button id="start">Demarrer</button><button id="stop">Arreter</button><button id="reload">Actualiser</button>
  <span id="msg" class="note"></span>
</div>
<div id="view"><div class="empty">Chargement...</div></div>
<script>
  var $ = function (id) { return document.getElementById(id); };
  function api(method, p) { return fetch('/api/plugins/freellm' + p, { method: method, headers: { 'Content-Type': 'application/json' }, body: method === 'POST' ? '{}' : undefined }).then(function (r) { return r.json(); }); }
  function setPill(el, ok, text) { el.className = 'pill ' + (ok ? 'ok' : 'bad'); el.textContent = text; }
  var shown = false;
  function refresh() {
    api('GET', '/status').then(function (s) {
      setPill($('run'), s.running, s.running ? 'en marche (port ' + s.port + ')' : 'arrete');
      setPill($('cfg'), s.configured, s.configured ? 'cle unifiee configuree' : 'cle non configuree');
      $('mod').textContent = s.model ? 'modele : ' + s.model : '';
      $('start').disabled = s.running || !s.installed; $('stop').disabled = !s.managed;
      var v = $('view');
      if (s.running && !shown) { v.textContent = ''; var d1 = document.createElement('div'); d1.className = 'empty'; var a = document.createElement('a'); a.href = s.url; a.target = '_blank'; a.rel = 'noopener'; a.textContent = 'Ouvrir le tableau de bord FreeLLMAPI (cles, quotas, modeles)'; a.style.color = 'var(--acc)'; d1.appendChild(a); var n = document.createElement('p'); n.className = 'note'; n.textContent = 'Il s ouvre dans une fenetre separee : FreeLLMAPI refuse d etre affiche dans un cadre d une autre origine.'; d1.appendChild(n); v.appendChild(d1); shown = true; }
      else if (!s.running) { shown = false; v.textContent = ''; var d = document.createElement('div'); d.className = 'empty'; d.textContent = s.installed ? 'FreeLLMAPI est arrete. Cliquez sur Demarrer.' : 'FreeLLMAPI est introuvable (dossier ou version compilee absents).'; v.appendChild(d); }
    }).catch(function () { $('msg').textContent = 'Etat indisponible.'; });
  }
  $('start').onclick = function () { $('msg').textContent = 'Demarrage...'; api('POST', '/start').then(function (r) { $('msg').textContent = r.ok ? '' : (r.error || 'Echec'); refresh(); }); };
  $('stop').onclick = function () { api('POST', '/stop').then(function () { setTimeout(refresh, 800); }); };
  $('reload').onclick = function () { shown = false; refresh(); };
  refresh(); setInterval(refresh, 15000);
</script></body></html>
